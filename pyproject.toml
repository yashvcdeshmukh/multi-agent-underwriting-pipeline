[project]
name = "multi-agent-underwriting-pipeline"
version = "0.1.0"
description = "Multi-agent insurance underwriting pipeline (intake → enrichment → risk → recommendation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mypy>=2.4.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/underwriting"]

[tool.hatch.build.targets.wheel.force-include]
"src/underwriting/tables/appetite.yaml" = "underwriting/tables/appetite.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
]
