name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check src tests

      - name: Pytest
        run: uv run pytest
        env:
          # Agent unit tests will mock LLM calls; pipeline integration may skip without key
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
